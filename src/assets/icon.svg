<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d482"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00d482" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6"/>

  <!-- Glowing accent circle outline -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neonGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Play button badge -->
  <g filter="url(#glow)">
    <rect x="116" y="156" width="280" height="200" rx="48" fill="url(#neonGrad)"/>
    <polygon points="230,206 316,256 230,306" fill="#09090b"/>
  </g>
</svg>
