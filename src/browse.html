<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <title>OmarchyTube</title>
    <link rel="stylesheet" href="browse.css">
</head>
<body>
    <header>
        <h1>OmarchyTube</h1>
        <nav id="tabs">
            <button type="button" data-tab="recommended">Rekommenderat</button>
            <button type="button" data-tab="latest">Senaste</button>
            <button type="button" data-tab="subscriptions">Mina kanaler</button>
            <button type="button" data-tab="search">Sök</button>
        </nav>
        <input id="query" type="search" placeholder="Sök på YouTube — tryck /" autocomplete="off" spellcheck="false">
        <span id="status"></span>
    </header>
    <p id="notice" hidden></p>

    <section id="login" hidden>
        <div class="signin">
            <h1>Logga in på YouTube</h1>
            <p class="steg">1. &Ouml;ppna <b>yt.be/activate</b> p&aring; din telefon</p>
            <p id="login-code" class="kod" hidden></p>
            <p class="steg">2. Skriv koden ovan &mdash; eller skanna bilden</p>
            <img id="login-qr" alt="Skanna med telefonen">
            <p id="login-status" class="hint">H&auml;mtar din TV-session &hellip;</p>
        </div>
    </section>

    <main id="grid" tabindex="-1"></main>

    <!-- Spelaren bor i appens fönster (aldrig ett eget fönster). Esc stänger. -->
    <div id="spelare" hidden>
        <video id="video" controls autoplay playsinline></video>
        <div id="film-titel"></div>
        <div id="film-vantar">Hämtar strömmen …</div>
        <div class="spel-hint">Esc st&auml;nger &middot; mellanslag pausar</div>
    </div>
    <footer>
        <span>&larr; &rarr; &uarr; &darr; flytta</span>
        <span>Enter spelar</span>
        <span>H h&ouml;g kvalitet</span>
        <span>/ sök</span>
        <span>L sessionen</span>
        <span>F11 fullsk&auml;rm</span>
        <span>Ctrl+Q avslutar</span>
    </footer>
    <script src="browse.js"></script>
</body>
</html>
