<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OmarchyTube</title>
    <link rel="stylesheet" href="browse.css">
</head>
<body>
    <header>
        <h1>OmarchyTube</h1>
        <input id="query" type="search" placeholder="Search YouTube — press /" autocomplete="off" spellcheck="false">
        <span id="status"></span>
    </header>
    <p id="notice" hidden></p>
    <main id="grid" tabindex="-1"></main>
    <footer>
        <span>&larr; &rarr; &uarr; &darr; move</span>
        <span>Enter play</span>
        <span>/ search</span>
        <span>Esc back to home feed</span>
        <span>F1 YouTube TV</span>
        <span>F2 desktop</span>
        <span>F11 fullscreen</span>
    </footer>
    <script src="signed-out.js"></script>
    <script src="browse.js"></script>
</body>
</html>
