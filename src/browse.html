<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <title>OmarchyTube</title>
    <link rel="stylesheet" href="browse.css">
</head>
<body>
    <header>
        <h1>OmarchyTube</h1>
        <nav id="tabs">
            <button type="button" data-tab="recommended">Rekommenderat</button>
            <button type="button" data-tab="latest">Senaste</button>
            <button type="button" data-tab="subscriptions">Mina kanaler</button>
            <button type="button" data-tab="search">Sök</button>
            <button type="button" id="login-button">Logga in</button>
        </nav>
        <input id="query" type="search" placeholder="Sök på YouTube — tryck /" autocomplete="off" spellcheck="false">
        <span id="status"></span>
    </header>
    <p id="notice" hidden></p>

    <section id="login" hidden>
        <h2>Logga in</h2>
        <p id="login-status">Startar inloggningen …</p>
        <p id="login-code" hidden></p>
        <img id="login-qr" alt="" hidden>
        <p class="hint">Bilden är inloggningsrutan, visad i den här appen: skanna QR-koden med telefonen, eller öppna <b>yt.be/activate</b> och skriv koden. Inget YouTube-fönster öppnas.</p>
        <button type="button" id="open-login">Visa ny kod</button>
    </section>

    <main id="grid" tabindex="-1"></main>
    <footer>
        <span>&larr; &rarr; &uarr; &darr; flytta</span>
        <span>Enter spelar</span>
        <span>/ sök</span>
        <span>L logga in</span>
        <span>F11 fullsk&auml;rm</span>
        <span>Ctrl+Q avslutar</span>
    </footer>
    <script src="browse.js"></script>
</body>
</html>
