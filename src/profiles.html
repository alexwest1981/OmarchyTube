<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <title>Vem skall titta? — OmarchyTube</title>
    <link rel="stylesheet" href="profiles.css">
</head>
<body>
    <main>
        <h1>Vem skall titta?</h1>
        <p id="hint">Varje profil har sitt eget konto — eget flöde, egna prenumerationer och egna listor. En ny profil öppnar YouTubes QR-kod: skanna den med mobilen, så är kontot inloggat.</p>

        <ul id="people"></ul>

        <form id="add" hidden>
            <input id="name" type="text" maxlength="32" placeholder="Namn på profilen" autocomplete="off" spellcheck="false">
            <button type="submit">Lägg till</button>
            <button type="button" id="cancel">Avbryt</button>
        </form>

        <p id="status" role="status"></p>
    </main>

    <footer>
        <span>&larr; &rarr; välj</span>
        <span>Enter öppnar</span>
        <span>N ny profil</span>
        <span>Esc tillbaka</span>
        <span>Delete två gånger tar bort</span>
    </footer>

    <script src="profiles-page.js"></script>
</body>
</html>
